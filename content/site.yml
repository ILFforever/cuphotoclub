    - 'Bangkok, Thailand'

history:
  eyebrow: Our History
  image: '/club-icon.jpg'
  imageAlt: 'Archival photograph from CU Photo Club history'
  quote: 'Every photograph we make is a letter to the future.'
  quoteLead: 'A letter to the '
  quoteAccent: 'future.'
  body:
    - >-
      Founded in 1967 by a small group of Chulalongkorn University students
      with borrowed cameras and a shared obsession with the image, the CU Photo Club
      has grown into one of Thailand's most respected student photography organisations.
    - >-
      Over five decades, we have documented student life, cultural shifts, and the
      evolving cityscape of Bangkok — building an archive that is both personal
      record and historical testimony.
  sinceNum: '1967'
  sinceText:
    - Year founded
    - Bangkok, Thailand
  timeline: ['1967', '1980', '2000', 'Today']

